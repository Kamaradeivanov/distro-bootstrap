# Global tools — symlinked to ~/.config/mise/config.toml by install.sh.
# Update a tool: bump its version here, then run `mise install`.
# List available versions: `mise ls-remote <tool>` / check for updates: `mise outdated`.

[tools]
# Kubernetes
kubectl = "1.34.12"            # keep within ±1 minor of the clusters you manage
helm = "3.22.0"                # helm 4 is out: migrate deliberately
k9s = "0.51.0"
krew = "0.5.0"
kubecolor = "0.8.0"
cilium-cli = "0.20.1"
argocd = "3.5.3"

# IaC
opentofu = "1.12.6"
terragrunt = "1.1.6"
tflint = "0.64.0"
terraform-docs = "0.24.0"

# Cloud / forges
gcloud = "586.0.0"
scaleway = "2.62.0"
glab = "1.119.0"
gh = "2.101.0"

# Shell
starship = "1.26.0"

# Misc
node = "24"                    # current LTS line
pre-commit = "4.6.2"
sops = "3.13.3"
yq = "latest"                  # mikefarah/yq (the apt package is a different tool)
gron = "0.7.1"
