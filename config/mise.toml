# Global tools — symlinked to ~/.config/mise/config.toml by install.sh.
# Update a tool: bump its version here, then run `mise install`.
# List available versions: `mise ls-remote <tool>` / check for updates: `mise outdated`.

[tools]
# Kubernetes
kubectl = "1.37.1"             # keep within ±1 minor of the clusters you manage
helm = "4.3.0"                 # helm 4 line: bump minors freely, majors deliberately
k9s = "0.51.0"
krew = "0.5.0"
kubecolor = "0.8.0"
cilium-cli = "0.20.1"
argocd = "3.5.4"
istioctl = "1.31.1"            # match the istio control plane version of your clusters
velero = "1.18.4"              # keep in line with the velero server version

# Registries / images
crane = "0.22.1"               # google/go-containerregistry (not the krew `crane` plugin)
regctl = "0.11.6"

# IaC
opentofu = "1.13.1"
terragrunt = "1.1.6"
tflint = "0.64.0"
terraform-docs = "0.24.0"

# Cloud / forges
gcloud = "588.0.0"
scaleway = "2.65.1"
glab = "1.122.0"
gh = "2.102.0"
mc = "RELEASE.2025-08-13T08-35-41Z"  # MinIO client (not the krew `mc` plugin)

# Shell
starship = "1.26.0"

# Misc
node = "26"                    # current LTS line
pre-commit = "4.6.2"
sops = "3.13.3"
yq = "latest"                  # mikefarah/yq (the apt package is a different tool)
gron = "0.7.1"
