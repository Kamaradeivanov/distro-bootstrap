"$schema" = 'https://starship.rs/config-schema.json'
# Prompt config — symlinked to ~/.config/starship.toml. Docs: https://starship.rs/config/
# Symbols chosen to render without a Nerd Font.

command_timeout = 1000

# Right side: duration of the last command (if > 2s) and the time the prompt appeared,
# i.e. when the previous command finished.
right_format = '$cmd_duration$time'

[kubernetes]
disabled = false
format = '[⎈ $context( \($namespace\))]($style) '
contexts = [
  # gke_<project>_<zone>_<cluster> → <cluster>
  { context_pattern = "gke_.*_(?P<cluster>[\\w-]+)", context_alias = "$cluster" },
]

[gcloud]
# Show the active project only, not the account e-mail
format = '([☁️ $project]($style) )'

[nodejs]
symbol = "[⬢](bold green) "

[cmd_duration]
min_time = 2_000
format = '[⏱ $duration]($style) '

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time]($style)'
style = 'dimmed white'
